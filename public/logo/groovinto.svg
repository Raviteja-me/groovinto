<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#7B3FF2" offset="0%"/>
      <stop stop-color="#2D9CFF" offset="50%"/>
      <stop stop-color="#FF4FD8" offset="100%"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="288" height="288" rx="80" fill="#0B0B0F" stroke="url(#g)" stroke-width="4"/>
  <circle cx="160" cy="160" r="118" fill="url(#g)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="160" cy="160" r="86" fill="#0B0B0F"/>
  <text x="50%" y="54%" text-anchor="middle" fill="#F5F5F5" font-family="Space Grotesk, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="2">G</text>
  <text x="50%" y="70%" text-anchor="middle" fill="#8A8A8A" font-family="Space Grotesk, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="6">GROOVINTO</text>
</svg>
